# Rotina anti-pausa do Supabase.
# O plano gratuito do Supabase pausa projetos com pouca atividade após 7 dias. Esta rotina chama
# o endpoint /api/saude do deploy a cada 3 dias; a própria API consulta o banco, então nenhuma
# chave do Supabase precisa ficar no GitHub (só a URL pública, que não é segredo).
#
# Configuração: Settings > Secrets and variables > Actions > Variables > APP_URL
# (URL pública do deploy, sem barra no final). Também pode ser executada à mão em Actions > Keepalive.
name: Keepalive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/saude
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "A variável APP_URL não está configurada." >&2
            exit 1
          fi
          # Retentativas toleram a partida a frio do serviço no Render.
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 "$APP_URL/api/saude"
